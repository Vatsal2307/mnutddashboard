trigger:
  branches:
    include:
      - testbranch

pool:
  vmImage: "windows-latest"

variables:
  - group: manutd-dashboard-secrets

stages:
  # STAGE 1: Provision Cloud Infrastructure via Terraform
  - stage: InfraDeployment
    displayName: "Deploy Azure Infrastructure"
    jobs:
      - job: Terraform
        displayName: "Run Terraform Apply"
        steps:
          - task: TerraformInstaller@0
            inputs:
              terraformVersion: "latest"

          - pwsh: |
              echo "Initializing Terraform Backend..."
              terraform init `
                -backend-config="resource_group_name=rg-terraform-backend" `
                -backend-config="storage_account_name=samanutdtfstate2307" `
                -backend-config="container_name=tfstate" `
                -backend-config="key=prod.terraform.tfstate"
            displayName: "Terraform Init"
            workingDirectory: "$(System.DefaultWorkingDirectory)/mnuprematchdb"
            env:
              ARM_CLIENT_ID: $(AZURE_CLIENT_ID)
              ARM_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)
              ARM_TENANT_ID: $(AZURE_TENANT_ID)
              ARM_SUBSCRIPTION_ID: $(AZURE_SUBSCRIPTION_ID)

          - pwsh: |
              terraform apply -auto-approve
            displayName: "Terraform Apply"
            workingDirectory: "$(System.DefaultWorkingDirectory)/mnuprematchdb"
            env:
              ARM_CLIENT_ID: $(AZURE_CLIENT_ID)
              ARM_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)
              ARM_TENANT_ID: $(AZURE_TENANT_ID)
              ARM_SUBSCRIPTION_ID: $(AZURE_SUBSCRIPTION_ID)

  # STAGE 2: Package and Deploy PowerShell Function App
  - stage: BackendDeployment
    displayName: "Deploy PowerShell Backend"
    dependsOn: InfraDeployment
    jobs:
      - job: DeployFunction
        displayName: "Package & Push Function"
        steps:
          - task: ArchiveFiles@2
            inputs:
              rootFolderOrFile: "$(Build.SourcesDirectory)/mnuprematchdb"
              includeRootFolder: false
              archiveType: "zip"
              archiveFile: "$(Build.ArtifactStagingDirectory)/function.zip"
              replaceExistingArchive: true

          - pwsh: |
              echo "Logging into Azure..."
              az login --service-principal -u $(AZURE_CLIENT_ID) -p $(AZURE_CLIENT_SECRET) --tenant $(AZURE_TENANT_ID)
              az account set --subscription $(AZURE_SUBSCRIPTION_ID)

              echo "Pushing zip file to Function App..."
              az functionapp deployment source config-zip -g "rg-manutd-dashboard-prod" -n "func-manutd-datafetcher-2307" --src "$(Build.ArtifactStagingDirectory)/function.zip"

              echo "Injecting Football API Key into App Settings..."
              az functionapp config appsettings set -g "rg-manutd-dashboard-prod" -n "func-manutd-datafetcher-2307" --settings API_FOOTBALL_KEY="$(API_FOOTBALL_KEY)"
            displayName: "Deploy via Azure CLI"

  # STAGE 3: Deploy Frontend Static Web App
  - stage: FrontendDeployment
    displayName: "Deploy Dashboard Frontend"
    dependsOn: BackendDeployment
    jobs:
      - job: DeploySWA
        displayName: "Push HTML to Static Web App"
        pool:
          vmImage: "ubuntu-latest" # Overrides global pool: Microsoft's SWA task strictly requires a Linux VM
        steps:
          - checkout: self # Ensures the code is pulled onto this new Linux VM
          - task: AzureStaticWebApp@0
            inputs:
              app_location: "/mnuprematchdb"
              output_location: "" # Output is the root of app_location for plain HTML
              skip_app_build: true # Bypasses the build engine since we are using plain HTML
              azure_static_web_apps_api_token: $(SWA_DEPLOYMENT_TOKEN)
