<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manchester United Dashboard</title>
    <meta name="description" content="Live Manchester United dashboard — next fixture, last result, top scorers, season schedule.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #080808; }

        .glass {
            background: rgba(18, 18, 18, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.07);
        }

        .card-next  { border-left: 3px solid #dc2626; }
        .card-last  { border-left: 3px solid #6b7280; }
        .card-win   { border-left: 3px solid #16a34a !important; }
        .card-loss  { border-left: 3px solid #dc2626 !important; }
        .card-draw  { border-left: 3px solid #ca8a04 !important; }

        .badge {
            font-size: 0.6rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 2px 8px;
            border-radius: 999px;
        }
        .badge-red  { background: rgba(220,38,38,0.15); color: #f87171; border: 1px solid rgba(220,38,38,0.3); }
        .badge-gray { background: rgba(107,114,128,0.15); color: #9ca3af; border: 1px solid rgba(107,114,128,0.3); }
        .badge-blue { background: rgba(37,99,235,0.15); color: #60a5fa; border: 1px solid rgba(37,99,235,0.3); }

        .goal-row-mu  { border-left: 2px solid #16a34a; padding-left: 8px; }
        .goal-row-opp { border-left: 2px solid #6b7280; padding-left: 8px; }

        /* Subtle pulse on loading */
        @keyframes shimmer {
            0%,100% { opacity: 0.4; }
            50%      { opacity: 0.8; }
        }
        .loading { animation: shimmer 1.5s ease-in-out infinite; }

        /* Score flash */
        @keyframes pop { 0%{transform:scale(0.8);opacity:0} 60%{transform:scale(1.05)} 100%{transform:scale(1);opacity:1} }
        .score-pop { animation: pop 0.4s ease forwards; }

        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 99px; }
    </style>
</head>

<body class="min-h-screen text-white relative p-4 md:p-6">

    <!-- Background -->
    <div class="fixed inset-0 bg-cover bg-center -z-10 opacity-20"
        style="background-image: url('https://images.unsplash.com/photo-1628351424562-4217316719b0?q=80&w=2000');"></div>
    <div class="fixed inset-0 -z-10" style="background: radial-gradient(ellipse at top, #1a0000 0%, #080808 60%);"></div>

    <div class="container mx-auto max-w-5xl">

        <!-- Header -->
        <div class="flex flex-col items-center mb-8 pt-2">
            <img src="https://upload.wikimedia.org/wikipedia/en/7/7a/Manchester_United_FC_crest.svg"
                class="w-16 h-16 mb-3 drop-shadow-xl">
            <h1 class="text-xl font-black uppercase tracking-[0.2em] text-white">Manchester United</h1>
            <p class="text-gray-600 text-xs tracking-widest mt-1">LIVE DASHBOARD</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

            <!-- ── Next Match ─────────────────────────────────────────── -->
            <div id="card-next" class="glass p-6 rounded-2xl md:col-span-2 card-next">
                <p class="text-gray-500 text-xs uppercase tracking-widest mb-3">Next Match</p>
                <div id="hero-content" class="loading text-gray-600 text-lg">Fetching fixtures…</div>
            </div>

            <!-- ── Last Result ────────────────────────────────────────── -->
            <div id="card-last" class="glass p-5 rounded-2xl card-last">
                <p class="text-gray-500 text-xs uppercase tracking-widest mb-3">Last Result</p>
                <div id="last-content" class="loading text-gray-600 text-sm">Loading…</div>
            </div>

            <!-- ── Top Scorers ────────────────────────────────────────── -->
            <div class="glass p-5 rounded-2xl">
                <p class="text-gray-500 text-xs uppercase tracking-widest mb-4">Top Scorers</p>
                <div id="scorers-list" class="space-y-2 text-sm"></div>
            </div>

            <!-- ── Top Assists ─────────────────────────────────────────── -->
            <div class="glass p-5 rounded-2xl">
                <p class="text-gray-500 text-xs uppercase tracking-widest mb-4">Top Assists</p>
                <div id="assists-list" class="space-y-2 text-sm"></div>
            </div>

            <!-- ── Season Schedule ─────────────────────────────────────── -->
            <div class="glass p-5 rounded-2xl">
                <p class="text-gray-500 text-xs uppercase tracking-widest mb-4">Season Schedule</p>
                <div id="fixtures-list" class="space-y-1.5 text-xs h-72 overflow-y-auto pr-1"></div>
            </div>

        </div>

        <p class="text-center text-gray-700 text-xs mt-6">
            Data: football-data.org · API-Sports &nbsp;|&nbsp; Refreshes every 6h
        </p>
    </div>

    <script>
        const tableBaseUrl = "https://samanutddash174b6ed4.table.core.windows.net/manutdfixtures";
        const sasToken     = "&sv=2026-02-06&ss=t&srt=sco&sp=r&se=2030-07-09T21:59:23Z&st=2026-07-09T13:44:23Z&spr=https&sig=9nfU23leOZxxEUuAtRf3wYOaQR5wbETHHuPCLKC3B04%3D";

        const compMap = {
            'Premier League':         'PL',
            'FA Cup':                 'FA Cup',
            'EFL Cup':                'EFL Cup',
            'UEFA Champions League':  'UCL',
            'UEFA Europa League':     'UEL',
            'UEFA Conference League': 'UECL',
        };

        function compBadge(name, style = 'gray') {
            if (!name) return '';
            const short = compMap[name] || name;
            return `<span class="badge badge-${style}">${short}</span>`;
        }

        function fmtDate(iso) {
            return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
        }

        function fmtTime(iso) {
            return new Date(iso).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
        }

        // ── Render Next Match ──────────────────────────────────────────────
        function renderNextMatch(data) {
            const el   = document.getElementById('hero-content');
            el.classList.remove('loading');
            const ha   = data.IsHome === 'True' ? '🏠 Home' : '✈️ Away';
            const d    = new Date(data.MatchDate);
            el.innerHTML = `
                <div class="flex items-center gap-2 mb-2">
                    ${compBadge(data.Competition, 'red')}
                    <span class="text-gray-600 text-xs">${ha}</span>
                </div>
                <div class="text-4xl font-black mb-1">vs ${data.Opponent}</div>
                <div class="text-gray-400 text-sm mt-1">
                    ${fmtDate(data.MatchDate)}
                    <span class="text-gray-600 mx-1">·</span>
                    ${fmtTime(data.MatchDate)} UTC
                    <span class="text-gray-600 mx-1">·</span>
                    ${data.Venue}
                </div>`;
        }

        // ── Render Last Result ─────────────────────────────────────────────
        function renderLastResult(data) {
            const el     = document.getElementById('last-content');
            const card   = document.getElementById('card-last');
            el.classList.remove('loading');

            if (!data.LastScore || data.LastScore === 'N/A') {
                el.innerHTML = '<span class="text-gray-600 text-xs italic">No recent match data</span>';
                return;
            }

            const parts  = data.LastScore.split('-');
            const muG    = parseInt(parts[0] ?? 0);
            const oppG   = parseInt(parts[1] ?? 0);
            const result = muG > oppG ? 'W' : muG < oppG ? 'L' : 'D';

            // Card border colour by result
            card.classList.remove('card-last');
            card.classList.add(result === 'W' ? 'card-win' : result === 'L' ? 'card-loss' : 'card-draw');

            const scoreColor = result === 'W' ? 'text-green-400' : result === 'L' ? 'text-red-400' : 'text-yellow-400';
            const resultLabel = result === 'W' ? '✓ WIN' : result === 'L' ? '✗ LOSS' : '— DRAW';
            const resultColor = result === 'W' ? 'text-green-500' : result === 'L' ? 'text-red-500' : 'text-yellow-500';

            // Goals timeline
            let goalsHtml = '';
            try {
                const goals = JSON.parse(data.LastGoalsJSON || '[]');
                if (goals.length > 0) {
                    const sorted = [...goals].sort((a, b) => a.minute - b.minute);
                    goalsHtml = `<div class="mt-3 space-y-1.5">` +
                        sorted.map(g => {
                            const ogTag = g.isOG ? ' <span class="text-gray-500">(OG)</span>' : '';
                            const muClass = (g.isMU && !g.isOG) || (!g.isMU && g.isOG) ? 'goal-row-mu' : 'goal-row-opp';
                            const icon = (g.isMU && !g.isOG) || (!g.isMU && g.isOG) ? '⚽' : '⚽';
                            return `<div class="${muClass} flex justify-between items-center py-0.5">
                                <span class="text-gray-300 text-xs">${icon} ${g.scorer}${ogTag}</span>
                                <span class="text-gray-500 text-xs font-mono">${g.minute}'</span>
                            </div>`;
                        }).join('') +
                        `</div>`;
                }
            } catch(e) { /* ignore parse errors */ }

            el.innerHTML = `
                <div class="flex items-center gap-2 mb-2">
                    ${compBadge(data.LastCompetition, 'gray')}
                    <span class="${resultColor} text-xs font-bold">${resultLabel}</span>
                </div>
                <div class="flex items-baseline gap-3 mb-0.5">
                    <span class="${scoreColor} text-3xl font-black score-pop">${muG} – ${oppG}</span>
                </div>
                <div class="text-gray-500 text-xs">vs ${data.LastOpponent} · ${data.LastMatchDate ? fmtDate(data.LastMatchDate) : ''}</div>
                ${goalsHtml}`;
        }

        // ── Render Top Scorers / Assists ───────────────────────────────────
        function renderList(id, items, countColor) {
            const el = document.getElementById(id);
            el.innerHTML = items.length > 0
                ? items.map(p => `
                    <div class="flex justify-between items-center border-b border-white/5 pb-1.5">
                        <span class="text-gray-300 text-xs truncate pr-2">${p.name}</span>
                        <span class="${countColor} font-bold text-sm">${p.count}</span>
                    </div>`).join('')
                : '<div class="text-gray-600 text-xs italic">Stats unavailable</div>';
        }

        // ── Render Season Schedule ─────────────────────────────────────────
        function renderFixtures(fixturesJson) {
            const el = document.getElementById('fixtures-list');
            let fixtures = [];
            try { fixtures = JSON.parse(fixturesJson || '[]'); } catch(e) {}

            el.innerHTML = fixtures.length > 0
                ? fixtures.map(f => {
                    let ha = '';
                    if (f.isHome !== undefined && f.isHome !== null) {
                        ha = (f.isHome === true || f.isHome === 'true')
                            ? '<span class="text-blue-500 font-bold">H</span>'
                            : '<span class="text-yellow-500 font-bold">A</span>';
                    }
                    const compLabel = f.competition ? (compMap[f.competition] || f.competition) : '';
                    const comp = compLabel
                        ? `<span class="text-gray-600 text-xs border border-white/5 rounded px-1">${compLabel}</span>`
                        : '';
                    const statusColor = f.status === 'FINISHED' ? 'text-gray-600' : 'text-gray-400';
                    return `<div class="border-b border-white/5 py-1.5 flex justify-between items-center">
                        <span class="flex items-center gap-1.5">${ha}<span class="text-gray-300">${f.opponent}</span></span>
                        <div class="flex items-center gap-1.5">${comp}<span class="${statusColor} font-mono">${fmtDate(f.date)}</span></div>
                    </div>`;
                }).join('')
                : '<div class="text-gray-600 text-xs italic">Schedule unavailable</div>';
        }

        // ── Main ───────────────────────────────────────────────────────────
        async function init() {
            try {
                const res = await fetch(
                    `${tableBaseUrl}()?$filter=PartitionKey eq 'NextMatch'&$top=1${sasToken}`,
                    { headers: { 'Accept': 'application/json;odata=nometadata' } }
                );
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const json = await res.json();
                if (!json.value?.length) throw new Error('No data in table');

                const data = json.value[0];

                renderNextMatch(data);
                renderLastResult(data);
                renderList('scorers-list', JSON.parse(data.TopScorersJSON || '[]'), 'text-red-400');
                renderList('assists-list', JSON.parse(data.TopAssistsJSON || '[]'), 'text-blue-400');
                renderFixtures(data.AllFixturesJSON);

            } catch(e) {
                console.error(e);
                document.getElementById('hero-content').innerHTML =
                    `<div class="text-red-500 text-sm">Dashboard error: ${e.message}</div>`;
            }
        }

        init();
    </script>
</body>

</html>
