<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Man Utd Full Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #000;
        }

        .glass {
            background: rgba(26, 26, 26, 0.6);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body class="min-h-screen text-white relative p-6">
    <!-- Background image -->
    <div class="fixed inset-0 bg-cover bg-center -z-10"
        style="background-image: url('https://images.unsplash.com/photo-1628351424562-4217316719b0?q=80&w=2000');">
    </div>
    <div class="fixed inset-0 bg-black/80 -z-10"></div>

    <div class="container mx-auto max-w-4xl">
        <div class="flex flex-col items-center mb-8">
            <img src="https://upload.wikimedia.org/wikipedia/en/7/7a/Manchester_United_FC_crest.svg"
                class="w-20 h-20 mb-4 drop-shadow-xl">
            <h1 class="text-2xl font-bold uppercase tracking-widest">Manchester United</h1>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <!-- Next Match -->
            <div class="glass p-6 rounded-2xl md:col-span-3 border-l-4 border-red-600">
                <h2 class="text-xs text-gray-400 uppercase tracking-widest">Next Match</h2>
                <div id="hero-content" class="text-3xl font-bold mt-2">Loading...</div>
            </div>

            <!-- Stats -->
            <div class="glass p-6 rounded-2xl">
                <h2 class="text-xs text-gray-400 uppercase tracking-widest mb-4">Top 5 Scorers</h2>
                <div id="scorers-list" class="space-y-2 text-sm"></div>
            </div>
            <div class="glass p-6 rounded-2xl">
                <h2 class="text-xs text-gray-400 uppercase tracking-widest mb-4">Top 5 Assists</h2>
                <div id="assists-list" class="space-y-2 text-sm"></div>
            </div>

            <!-- Fixtures -->
            <div class="glass p-6 rounded-2xl md:col-span-1">
                <h2 class="text-xs text-gray-400 uppercase tracking-widest mb-4">Season Schedule</h2>
                <div id="fixtures-list" class="space-y-2 text-xs h-64 overflow-y-auto pr-2"></div>
            </div>
        </div>
    </div>

    <script>
        const tableBaseUrl = "https://samanutddash174b6ed4.table.core.windows.net/manutdfixtures";

        // FIXED: Changed the leading '?' to an '&' to properly append to the URL
        const sasToken = "&sv=2026-02-06&ss=t&srt=sco&sp=r&se=2030-07-09T21:59:23Z&st=2026-07-09T13:44:23Z&spr=https&sig=9nfU23leOZxxEUuAtRf3wYOaQR5wbETHHuPCLKC3B04%3D";

        async function init() {
            const hero = document.getElementById('hero-content');
            try {
                const response = await fetch(`${tableBaseUrl}()?$filter=PartitionKey eq 'NextMatch'&$top=1${sasToken}`, {
                    headers: { 'Accept': 'application/json;odata=nometadata' }
                });

                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);

                const json = await response.json();
                if (!json.value || json.value.length === 0) throw new Error("No data found in table");

                const data = json.value[0];

                // ... (rest of your rendering logic remains the same) ...
                // Build competition badge for hero
                const compBadge = data.Competition
                    ? `<span class="text-xs font-semibold uppercase tracking-widest px-2 py-0.5 rounded-full bg-red-600/30 text-red-400 border border-red-600/50">${data.Competition}</span>`
                    : '';
                const homeAway = data.IsHome === 'True' ? '🏠 Home' : '✈️ Away';
                hero.innerHTML = `
                    <div class="flex items-center gap-2 mb-1">${compBadge}<span class="text-xs text-gray-500">${homeAway}</span></div>
                    vs ${data.Opponent}<br>
                    <span class="text-lg text-gray-400">${new Date(data.MatchDate).toDateString()} @ ${data.Venue}</span>`;

                // Render lists (with fallbacks for empty/undefined data)
                const scorersData = JSON.parse(data.TopScorersJSON || '[]');
                document.getElementById('scorers-list').innerHTML = scorersData.length > 0
                    ? scorersData.map(p => `<div class="flex justify-between border-b border-white/10 pb-1"><span>${p.name}</span><span class="text-red-400 font-bold">${p.count}</span></div>`).join('')
                    : '<div class="text-gray-500 text-xs italic">Stats unavailable (Rate Limited)</div>';

                const assistsData = JSON.parse(data.TopAssistsJSON || '[]');
                document.getElementById('assists-list').innerHTML = assistsData.length > 0
                    ? assistsData.map(p => `<div class="flex justify-between border-b border-white/10 pb-1"><span>${p.name}</span><span class="text-blue-400 font-bold">${p.count}</span></div>`).join('')
                    : '<div class="text-gray-500 text-xs italic">Stats unavailable (Rate Limited)</div>';

                const fixturesData = JSON.parse(data.AllFixturesJSON || '[]');
                document.getElementById('fixtures-list').innerHTML = fixturesData.length > 0
                    ? fixturesData.map(f => {
                        // Only show H/A badge if field exists (guards against stale pre-update data)
                        let ha = '';
                        if (f.isHome !== undefined && f.isHome !== null) {
                            ha = (f.isHome === true || f.isHome === 'true')
                                ? '<span class="text-blue-400 font-bold text-xs">H</span>'
                                : '<span class="text-yellow-400 font-bold text-xs">A</span>';
                        }
                        const statusColor = f.status === 'FINISHED' ? 'text-gray-600' : 'text-green-400';
                        const compMap = { 'Premier League': 'PL', 'FA Cup': 'FA Cup', 'EFL Cup': 'EFL Cup', 'UEFA Europa League': 'UEL', 'UEFA Champions League': 'UCL', 'UEFA Conference League': 'UECL' };
                        const compLabel = f.competition ? (compMap[f.competition] || f.competition) : '';
                        const comp = compLabel ? `<span class="text-gray-500 text-xs border border-white/10 rounded px-1">${compLabel}</span>` : '';
                        return `<div class="border-b border-white/5 py-1 flex justify-between items-center gap-1">
                            <span class="flex items-center gap-1">${ha}<span>${f.opponent}</span></span>
                            <div class="flex gap-2 items-center">${comp}<span class="${statusColor}">${new Date(f.date).toLocaleDateString()}</span></div>
                        </div>`;
                    }).join('')
                    : '<div class="text-gray-500 text-xs italic">Schedule unavailable</div>';

            } catch (e) {
                console.error(e);
                hero.innerHTML = `<div class="text-red-500 text-sm">Dashboard Error: ${e.message}</div>`;
            }
        }
        init();
    </script>
</body>

</html>
