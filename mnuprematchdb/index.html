<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manchester United Matchday Hub</title>
    <style>
        :root {
            --mu-red: #DA291C;
            --mu-black: #000000;
            --mu-white: #FFFFFF;
            --mu-dark-grey: #1A1A1A;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--mu-black);
            color: var(--mu-white);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            background: var(--mu-dark-grey);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(218, 41, 28, 0.2);
            border-top: 5px solid var(--mu-red);
            width: 90%;
            max-width: 500px;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .badge {
            background-color: var(--mu-red);
            color: var(--mu-white);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 1.5rem;
        }

        .match-details {
            font-size: 1.2rem;
            margin: 1.5rem 0;
        }

        .opponent {
            font-size: 2rem;
            font-weight: bold;
            color: var(--mu-white);
            margin: 0.5rem 0;
        }

        .meta-info {
            color: #AAAAAA;
            font-size: 0.9rem;
            margin-top: 1rem;
        }

        .loading {
            color: #888888;
            font-style: italic;
        }

        .error {
            color: var(--mu-red);
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="badge" id="competition">GGMU</div>
        <h1>Next Match</h1>

        <div id="dashboard-content">
            <p class="loading">Fetching latest fixture data...</p>
        </div>
    </div>

    <script>
        // 1. EDIT THIS: Replace 'samanutddashABCD' with your ACTUAL Storage Account name
        const tableBaseUrl = "https://samanutdtfstate2307.table.core.windows.net/manutdfixtures";

        // 2. EDIT THIS: PASTE YOUR SAS TOKEN HERE (Must start with '?')
        const sasToken = "?sv=2026-02-06&ss=t&srt=o&sp=r&se=2029-07-08T12:53:15Z&st=2026-07-08T04:38:15Z&spr=https&sig=gWKHVBV3ldNq73kUaqjELIdgF50msWlw%2Bl9XNAOMBk8%3D";

        async function fetchMatchData() {
            const contentDiv = document.getElementById('dashboard-content');
            const compBadge = document.getElementById('competition');

            try {
                // Ensure token is formatted correctly for query string usage
                const cleanSas = sasToken.startsWith('?') ? sasToken.substring(1) : sasToken;

                // Fetch the newest row using $top=1
                const queryUrl = `${tableBaseUrl}()?$filter=PartitionKey eq 'NextMatch'&$top=1&${cleanSas}`;

                const response = await fetch(queryUrl, {
                    headers: { 'Accept': 'application/json;odata=nometadata' }
                });

                if (!response.ok) {
                    throw new Error(`Data access failed. Status: ${response.status}`);
                }

                const result = await response.json();

                if (!result.value || result.value.length === 0) {
                    throw new Error("No match records found.");
                }

                // Parse the newest record (first index)
                const data = result.value[0];

                const matchDate = new Date(data.MatchDate).toLocaleString([], {
                    weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
                });

                compBadge.innerText = data.Competition;

                contentDiv.innerHTML = `
                    <div class="meta-info">${data.IsHomeMatch ? 'HOME' : 'AWAY'} MATCH</div>
                    <div class="opponent">vs ${data.Opponent}</div>
                    <div class="match-details">${matchDate}</div>
                    <div class="meta-info">📍 ${data.Venue}</div>
                `;

            } catch (error) {
                console.error("Dashboard Error:", error);
                contentDiv.innerHTML = `
                    <p class="error">Match center temporarily unavailable</p>
                    <p style="font-size: 0.8rem; color: #888;">Check console for CORS or DNS issues.</p>
                `;
            }
        }

        fetchMatchData();
    </script>
</body>

</html>
