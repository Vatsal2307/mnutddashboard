<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Man Utd Full Dashboard</title>
    <style>
        :root {
            --mu-red: #DA291C;
            --mu-black: #000000;
            --mu-white: #FFFFFF;
            --mu-dark-grey: #1A1A1A;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--mu-black);
            color: var(--mu-white);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
            width: 100%;
            max-width: 800px;
        }

        .card {
            background: var(--mu-dark-grey);
            padding: 1.5rem;
            border-radius: 12px;
            border-top: 4px solid var(--mu-red);
        }

        .full-width {
            grid-column: span 2;
        }

        h2 {
            margin-top: 0;
            font-size: 1.1rem;
            color: #aaa;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #888;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th {
            text-align: left;
            color: #888;
            padding: 0.5rem;
            border-bottom: 1px solid #444;
        }

        td {
            padding: 0.5rem;
            border-bottom: 1px solid #222;
        }

        .loading {
            text-align: center;
            padding: 2rem;
        }
    </style>
</head>

<body>
    <div class="dashboard" id="main-ui">
        <div class="card full-width" id="next-match">
            <h2>Next Match</h2>
            <div id="hero-content">Loading match data...</div>
        </div>

        <div class="card">
            <h2>Top Scorer</h2>
            <div class="stat-value" id="scorer-name">...</div>
            <div class="stat-label" id="scorer-goals">...</div>
        </div>

        <div class="card">
            <h2>Top Assists</h2>
            <div class="stat-value" id="assist-name">...</div>
            <div class="stat-label" id="assist-count">...</div>
        </div>

        <div class="card full-width">
            <h2>Season Fixtures</h2>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Opponent</th>
                            <th>Result/Status</th>
                        </tr>
                    </thead>
                    <tbody id="fixtures-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        /* CONFIGURATION: IMPORTANT - REPLACE THE VALUES BELOW */

        // UPDATE THIS: Replace 'YOUR_STORAGE_ACCOUNT_NAME' with your actual account name (e.g., samanutddash1234)
        const tableBaseUrl = "https://samanutddash174b6ed4.table.core.windows.net/manutdfixtures";

        // UPDATE THIS: Paste your actual SAS token (must include the leading ?)
        const sasToken = "?sv=2026-02-06&ss=t&srt=sco&sp=r&se=2030-07-09T19:31:32Z&st=2026-07-09T11:16:32Z&spr=https&sig=arLaMHOJEi%2Fv1ro80cGY%2BAhJqwal1W7F5REZHrxS6Q8%3D";

        async function init() {
            try {
                // Fetch the newest entity by querying the top 1
                const url = `${tableBaseUrl}()?$filter=PartitionKey eq 'NextMatch'&$top=1&${sasToken.substring(1)}`;
                const response = await fetch(url, { headers: { 'Accept': 'application/json;odata=nometadata' } });

                if (!response.ok) throw new Error("Check your Storage Account Name/SAS Token configuration.");

                const data = (await response.json()).value[0];

                if (!data) throw new Error("No dashboard data found in storage table.");

                // 1. Update Hero Card
                document.getElementById('hero-content').innerHTML = `
                    <div style="font-size: 2rem; font-weight: bold;">vs ${data.Opponent}</div>
                    <div>${new Date(data.MatchDate).toDateString()} | ${data.Venue}</div>
                `;

                // 2. Update Stats
                document.getElementById('scorer-name').innerText = data.TopScorerName;
                document.getElementById('scorer-goals').innerText = `${data.TopScorerGoals} Goals`;
                document.getElementById('assist-name').innerText = data.TopAssistName;
                document.getElementById('assist-count').innerText = `${data.TopAssistCount} Assists`;

                // 3. Update Fixture Table
                const fixtures = JSON.parse(data.AllFixturesJSON);
                const tbody = document.getElementById('fixtures-body');
                tbody.innerHTML = fixtures.map(f => `
                    <tr>
                        <td>${new Date(f.date).toLocaleDateString()}</td>
                        <td>${f.opponent} ${f.isHome ? '(H)' : '(A)'}</td>
                        <td>${f.status === 'FINISHED' ? `${f.scoreHome}-${f.scoreAway}` : 'Upcoming'}</td>
                    </tr>
                `).join('');

            } catch (err) {
                console.error(err);
                document.getElementById('main-ui').innerHTML = `<p class="loading">Error loading dashboard: ${err.message}</p>`;
            }
        }

        init();
    </script>
</body>

</html>
