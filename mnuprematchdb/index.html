<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Man Utd Full Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #000;
        }

        .glass {
            background: rgba(26, 26, 26, 0.6);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body class="min-h-screen text-white relative p-6">
    <!-- Background image -->
    <div class="fixed inset-0 bg-cover bg-center -z-10"
        style="background-image: url('https://images.unsplash.com/photo-1628351424562-4217316719b0?q=80&w=2000');">
    </div>
    <div class="fixed inset-0 bg-black/80 -z-10"></div>

    <div class="container mx-auto max-w-4xl">
        <div class="flex flex-col items-center mb-8">
            <img src="https://upload.wikimedia.org/wikipedia/en/7/7a/Manchester_United_FC_crest.svg"
                class="w-20 h-20 mb-4 drop-shadow-xl">
            <h1 class="text-2xl font-bold uppercase tracking-widest">Manchester United</h1>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <!-- Next Match -->
            <div class="glass p-6 rounded-2xl md:col-span-3 border-l-4 border-red-600">
                <h2 class="text-xs text-gray-400 uppercase tracking-widest">Next Match</h2>
                <div id="hero-content" class="text-3xl font-bold mt-2">Loading...</div>
            </div>

            <!-- Stats -->
            <div class="glass p-6 rounded-2xl">
                <h2 class="text-xs text-gray-400 uppercase tracking-widest mb-4">Top 5 Scorers</h2>
                <div id="scorers-list" class="space-y-2 text-sm"></div>
            </div>
            <div class="glass p-6 rounded-2xl">
                <h2 class="text-xs text-gray-400 uppercase tracking-widest mb-4">Top 5 Assists</h2>
                <div id="assists-list" class="space-y-2 text-sm"></div>
            </div>

            <!-- Fixtures -->
            <div class="glass p-6 rounded-2xl md:col-span-1">
                <h2 class="text-xs text-gray-400 uppercase tracking-widest mb-4">Season Schedule</h2>
                <div id="fixtures-list" class="space-y-2 text-xs h-64 overflow-y-auto pr-2"></div>
            </div>
        </div>
    </div>

    <script>
        const tableBaseUrl = "https://samanutddash174b6ed4.table.core.windows.net/manutdfixtures";
        const sasToken = "?sv=2026-02-06&ss=t&srt=sco&sp=r&se=2030-07-09T19:31:32Z&st=2026-07-09T11:16:32Z&spr=https&sig=arLaMHOJEi%2Fv1ro80cGY%2BAhJqwal1W7F5REZHrxS6Q8%3D";

        async function init() {
            const hero = document.getElementById('hero-content');
            try {
                // Note: Added the 'odata=nometadata' header which is required for Azure Tables
                const response = await fetch(`${tableBaseUrl}()?$filter=PartitionKey eq 'NextMatch'&$top=1${sasToken}`, {
                    headers: { 'Accept': 'application/json;odata=nometadata' }
                });

                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);

                const json = await response.json();
                if (!json.value || json.value.length === 0) throw new Error("No data found in table");

                const data = json.value[0];

                // ... (rest of your rendering logic remains the same) ...
                hero.innerHTML = `vs ${data.Opponent} <br><span class="text-lg text-gray-400">${new Date(data.MatchDate).toDateString()} @ ${data.Venue}</span>`;

                // Render lists (Make sure these IDs exist in your HTML)
                document.getElementById('scorers-list').innerHTML = JSON.parse(data.TopScorersJSON).map(p => `<div class="flex justify-between border-b border-white/10 pb-1"><span>${p.name}</span><span class="text-red-400 font-bold">${p.count}</span></div>`).join('');
                document.getElementById('assists-list').innerHTML = JSON.parse(data.TopAssistsJSON).map(p => `<div class="flex justify-between border-b border-white/10 pb-1"><span>${p.name}</span><span class="text-blue-400 font-bold">${p.count}</span></div>`).join('');
                document.getElementById('fixtures-list').innerHTML = JSON.parse(data.AllFixturesJSON).map(f => `<div class="border-b border-white/5 py-1 flex justify-between"><span>${f.opponent}</span><span class="text-gray-500">${new Date(f.date).toLocaleDateString()}</span></div>`).join('');

            } catch (e) {
                console.error(e);
                hero.innerHTML = `<div class="text-red-500 text-sm">Dashboard Error: ${e.message}</div>`;
            }
        }
        init();
    </script>
</body>

</html>
